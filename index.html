<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Planet as the Main Character</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23264a7a'/><path d='M6 12q7 4 13 0t7 3-6 6-9-1-5-8z' fill='%234f8f5c'/></svg>">
</head>
<body>

<header id="top">
  <div id="identity">
    <h1>A planet as the main character</h1>
    <div id="year-block">
      <span id="year">0 yr</span>
      <span id="year-sub"></span>
    </div>
  </div>
  <div id="stats"></div>
</header>

<main>
  <section id="stage">
    <div id="globes">
      <div class="globe-wrap">
        <canvas id="globe"></canvas>
      </div>
      <div class="globe-wrap hidden" id="compare-wrap">
        <canvas id="globe-compare"></canvas>
        <div id="compare-label" class="globe-tag"></div>
      </div>
    </div>

    <div id="view-modes" class="chips"></div>

    <div id="stage-foot">
      <div id="cell-info"></div>
    </div>
  </section>

  <section id="side">
    <nav id="tabs">
      <button class="tab on" data-tab="model">Why?</button>
      <button class="tab" data-tab="tools">Interventions</button>
      <button class="tab" data-tab="species">Life</button>
      <button class="tab" data-tab="chronicle">Chronicle</button>
      <button class="tab" data-tab="branches">Branches</button>
      <button class="tab" data-tab="challenge">Objectives</button>
    </nav>
    <div id="panel-body" data-panel="model"></div>
  </section>

  <section id="cycle-panel">
    <h3>Planetary cycle<span class="hint">carbon, as the model moved it this step</span></h3>
    <canvas id="cycle"></canvas>
  </section>

  <section id="chart-panel">
    <div id="chart-head">
      <div id="series-toggles" class="chips"></div>
      <div id="timeline-controls">
        <span id="scrub-label" class="hint">drag the chart to pick a moment</span>
        <button id="rewind" class="small">rewind here</button>
        <button id="fork" class="small">fork here</button>
      </div>
    </div>
    <canvas id="charts"></canvas>
  </section>
</main>

<footer id="controls">
  <div id="scales" class="control-group"></div>
  <div class="control-group">
    <button id="play">▶ run</button>
    <div id="speeds" class="chips"></div>
    <button id="spin" class="small">spin: on</button>
  </div>
  <div class="control-group">
    <label class="field">seed
      <input id="seed-input" type="text" spellcheck="false" autocomplete="off">
    </label>
    <button id="new-world" class="small">new world</button>
    <button id="random-seed" class="small">random</button>
    <button id="share" class="small">copy replay link</button>
  </div>
  <div class="control-group">
    <label class="field">objective
      <select id="challenge-select"></select>
    </label>
    <label class="field">climate model
      <select id="climate-model"></select>
    </label>
    <label class="field">evolution model
      <select id="biosphere-model"></select>
    </label>
    <span class="hint">state <code id="fingerprint">--------</code></span>
  </div>
</footer>

<div id="toast" class="hidden"></div>

<div id="ending" class="hidden">
  <div id="ending-card">
    <h2 id="ending-title"></h2>
    <p id="ending-text"></p>
    <h3>What happened here</h3>
    <div id="ending-chronicle"></div>
    <button id="close-ending">close</button>
  </div>
</div>

<script type="module" src="src/ui/app.js"></script>
</body>
</html>
